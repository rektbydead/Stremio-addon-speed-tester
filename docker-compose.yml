services:
  addon:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    networks:
      - stremio-addon-speed-test
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - stremio-addon-speed-test
    depends_on:
      - addon
    command: ["npx", "tsx", "./src/bullmq/workers/addStreamWorker.ts"]
    deploy:
      mode: replicated
      replicas: 2

  redis:
    image: docker.io/redis:alpine
    command: redis-server --save "" --appendonly no
    networks:
      - stremio-addon-speed-test

networks:
  stremio-addon-speed-test:
    driver: bridge